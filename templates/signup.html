{% extends 'layout.html' %} {% block content %}
<h1>Signup Form</h1>
<form action="/signup.html" method="POST" class="box">
  <div class="input__wrapper">
    <input
      type="text"
      name="username"
      placeholder="Username"
      class="input__field"
    />
  </div>
  <div class="input__wrapper">
    <input
      type="password"
      name="password"
      placeholder="Password Must be 8 Char Long with number and Special Char"
      class="input__field"
    />
    {% if is_done %}
    <h2>Password does not comply with site requirements</h2>
    {% endif %}
  </div>
  <div class="input__wrapper">
    <input
      type="dateOfBirth"
      name="dob"
      placeholder="Date of Birth"
      class="input__field"
    />
  </div>
  <div class="input__wrapper">
    <button type="submit" class="btn">Submit</button>
  </div>
</form>
{% endblock %}
